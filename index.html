<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlantCare - Monitoring Tanaman</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: bold; }
        .nav-link.active { font-weight: bold; border-bottom: 2px solid #fff; }
    </style>
</head>
<body>

    <!-- Header / Navigasi Responsif -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-success sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="bi bi-flower1"></i> PlantCare</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link nav-ajax active" href="#" data-page="views/dashboard.html">
                            <i class="bi bi-speedometer2"></i> Dashboard Kebun
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-ajax" href="#" data-page="views/tambah-tanaman.html">
                            <i class="bi bi-plus-circle"></i> Tambah Tanaman
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Wadah Konten Dinamis (AJAX Target) -->
    <main id="main-content" class="container my-4">
        <!-- Konten akan dimuat di sini secara otomatis via AJAX -->
    </main>

    <!-- Footer -->
    <footer class="bg-white border-top py-3 mt-auto text-center text-muted">
        <div class="container">
            <small>&copy; 2026 PlantCare - D4 Manajemen Informatika UNESA (Kelompok 06)</small>
        </div>
    </footer>

    <!-- JS Libraries (jQuery & Bootstrap) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Script Routing AJAX (Poin 2.a) -->
    <script>
        $(document).ready(function() {
            // Fungsi Load Halaman via AJAX
            function loadPage(pageUrl) {
                $('#main-content').fadeOut(150, function() {
                    $(this).load(pageUrl, function(response, status, xhr) {
                        if (status === "error") {
                            $('#main-content').html(`
                                <div class="alert alert-danger text-center shadow-sm">
                                    <i class="bi bi-exclamation-triangle-fill fs-3"></i>
                                    <p class="mb-0 mt-2">Gagal memuat halaman <b>${pageUrl}</b>. Pastikan file tersedia.</p>
                                </div>
                            `);
                        }
                        $(this).fadeIn(150);
                    });
                });
            }

            // Halaman default saat pertama dibuka
            loadPage('views/dashboard.html');

            // Event handler klik menu navbar
            $('.nav-ajax').click(function(e) {
                e.preventDefault();
                $('.nav-ajax').removeClass('active');
                $(this).addClass('active');
                
                let page = $(this).data('page');
                loadPage(page);
            });
        });
    </script>
</body>
</html>
